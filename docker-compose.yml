services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forwardpro
      POSTGRES_USER: forwardpro
      POSTGRES_PASSWORD: forwardpro_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    depends_on:
      - db
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://forwardpro:forwardpro_dev@db:5432/forwardpro
      JWT_SECRET: change-me-in-production
    ports:
      - "3000:3000"
volumes:
  pgdata:
